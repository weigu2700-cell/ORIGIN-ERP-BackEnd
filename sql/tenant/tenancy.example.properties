# Copy outside the repository and inject credentials from the deployment environment.
# The same property names are supported by SPRING_CONFIG_ADDITIONAL_LOCATION at runtime.
tenancy.mode=multi
tenancy.platform.url=jdbc:mysql://127.0.0.1:3306/erp_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
tenancy.platform.username=${PLATFORM_DB_USER}
tenancy.platform.password=${PLATFORM_DB_PASSWORD}
tenancy.connections.enterprise_a.url=jdbc:mysql://127.0.0.1:3306/erp_a?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
tenancy.connections.enterprise_a.username=${TENANT_A_DB_USER}
tenancy.connections.enterprise_a.password=${TENANT_A_DB_PASSWORD}
tenancy.connections.enterprise_b.url=jdbc:mysql://127.0.0.1:3306/erp_b?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
tenancy.connections.enterprise_b.username=${TENANT_B_DB_USER}
tenancy.connections.enterprise_b.password=${TENANT_B_DB_PASSWORD}
