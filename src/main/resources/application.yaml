spring:
  application:
    name: origin-erp-server
  datasource:
    url: jdbc:mysql://localhost:3306/smart-erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: MySQL6636
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms

  flyway:
    # 表已用手动建表脚本创建， Flyway 仅接管增量迁移；
    # 首次启动时对已有库打基线（version<=1 视为已存在），再应用后续迁移。
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # 迁移脚本使用 MySQL 用户变量（@var）与动态 PREPARE，禁用占位符替换避免误解析
    placeholder-replacement: false

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          temperature: 0.2
        memory:
          repository:
            jdbc:
              initialize-schema: always

      embedding: # ← 向量化指向另一家
        base-url: https://ws-7f32tp7l65ra67nu.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: sk-ws-H.PIYRIED.ZtZQ.MEYCIQDecBlsvfJF_qm5FtfHUaWtd0yMfKD0fNH1kBNSxbrBHwIhAPsg0EaUbI2pNwyQRFCkJPVcGdHLSlvX0r35nR09935B
        options: # ← ① model 必须挂在 options 下，直接写 model 是无效属性
          model: qwen3.7-text-embedding
    # ② retrieve 不是 spring.ai 的属性，放在 openai 下会被静默忽略，必须挪到顶层自定义命名空间
rag:
  retrieve:
    top-k: 4
    min-score: 0.5

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.smart.erp.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.smart.erp: debug

security:
  jwt:
    secret: ${JWT_SECRET:c21hcnQtZXJwLXNlY3JldC1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVz=}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:18000000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    operations-sorter: method
