spring:
  application:
    name: origin-erp-server
  datasource:
    url: jdbc:mysql://localhost:3306/smart-erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: MySQL6636
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          temperature: 0.2
        memory:
          repository:
            jdbc:
              initialize-schema: always
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.smart.erp.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.smart.erp: debug

security:
  jwt:
    secret: ${JWT_SECRET:c21hcnQtZXJwLXNlY3JldC1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVz=}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:18000000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    operations-sorter: method
